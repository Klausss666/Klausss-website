<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🍔 扭蛋晚餐机 - 带BGM</title>
    <style>
        /* ===== 原有样式 (未改动，仅保留) ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f7e6d3;
            background-image:
                radial-gradient(circle at 20% 30%, #fdf0e0 0%, #f7e6d3 80%),
                repeating-linear-gradient(45deg, #d4b8a0 0px, #d4b8a0 2px, transparent 2px, transparent 8px);
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
            padding: 20px;
        }

        .game-container {
            max-width: 600px;
            width: 100%;
            background: #fcf3e8;
            border-radius: 60px 60px 40px 40px;
            padding: 30px 30px 45px;
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.2), 0 8px 12px rgba(0, 0, 0, 0.1);
            border: 6px solid #fff3e0;
            position: relative;
            transition: all 0.2s;
        }

        .game-container::before {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            background: repeating-conic-gradient(#e74c3c 0% 25%, #fff 0% 50%) 0 0 / 30px 30px;
            opacity: 0.08;
            border-radius: 70px 70px 50px 50px;
            z-index: -1;
            pointer-events: none;
        }

        .title {
            text-align: center;
            font-size: 2.2rem;
            font-weight: bold;
            color: #5d3a1a;
            text-shadow: 3px 3px 0 #f0c8a0, 0 0 0 #000;
            margin-bottom: 10px;
            letter-spacing: 2px;
            word-break: break-word;
        }
        .title span {
            display: inline-block;
            transform: rotate(-5deg);
        }

        .gacha-machine {
            background: #b68b6b;
            background-image:
                linear-gradient(135deg, #dbb48b 0%, #b68b6b 40%, #8b6b4f 80%, #7a5d44 100%);
            border-radius: 80px 80px 40px 40px;
            padding: 25px 30px 35px;
            box-shadow:
                inset 0 -8px 0 #5d3a1a,
                inset 0 8px 10px rgba(255, 215, 175, 0.6),
                0 15px 20px rgba(0, 0, 0, 0.4);
            border: 4px solid #5d3a1a;
            position: relative;
            margin: 15px 0;
            transition: 0.3s;
        }

        .gacha-machine::after {
            content: '';
            position: absolute;
            inset: 10px;
            border-radius: 70px 70px 30px 30px;
            background: repeating-linear-gradient(90deg,
                    transparent,
                    transparent 20px,
                    rgba(0, 0, 0, 0.03) 20px,
                    rgba(0, 0, 0, 0.03) 22px);
            pointer-events: none;
        }

        .machine-top {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 40px;
            background: #b68b6b;
            background-image: linear-gradient(to bottom, #dbb48b, #a77c5a);
            border-radius: 50px 50px 0 0;
            border: 4px solid #5d3a1a;
            border-bottom: none;
            box-shadow: 0 -6px 0 #7a5d44;
        }
        .machine-top::before {
            content: '⚙️';
            position: absolute;
            top: -28px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 28px;
            filter: drop-shadow(2px 4px 6px rgba(0, 0, 0, 0.3));
        }

        .window {
            background: radial-gradient(circle at 30% 30%, #d9e6f0, #8aa3b8);
            border-radius: 50%;
            width: 200px;
            height: 200px;
            margin: 10px auto 20px;
            box-shadow:
                inset 0 -10px 20px rgba(0, 0, 0, 0.5),
                inset 0 10px 20px rgba(255, 255, 255, 0.6),
                0 0 0 8px #5d3a1a,
                0 0 0 12px #8b6b4f;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: all 0.3s;
            overflow: hidden;
        }

        .window::before {
            content: '';
            position: absolute;
            top: 10%;
            left: 15%;
            width: 35%;
            height: 25%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.7) 0%, transparent 80%);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.7;
        }

        .gacha-ball {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: #f0e6d8;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-size: 2.8rem;
            font-weight: 900;
            color: #3d2b1a;
            box-shadow: inset 0 -8px 0 rgba(0, 0, 0, 0.2), 0 8px 20px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s, background 0.3s;
            text-align: center;
            line-height: 1.2;
            padding: 10px;
            position: relative;
            z-index: 2;
        }

        .gacha-ball::before {
            content: '';
            position: absolute;
            top: 8%;
            left: 12%;
            width: 30%;
            height: 20%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.6) 0%, transparent 80%);
            border-radius: 50%;
            pointer-events: none;
        }

        /* 按钮区域：同时容纳开启按钮和音乐开关 */
        .button-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
        }

        .btn-open {
            flex: 1 1 160px;
            padding: 18px 10px;
            font-size: 1.8rem;
            font-weight: bold;
            font-family: inherit;
            background: #f1c40f;
            background: linear-gradient(145deg, #f7dc6f, #d4ac0d);
            border: 5px solid #7a5d44;
            border-radius: 60px;
            color: #3d2b1a;
            text-shadow: 2px 2px 0 #f7dc6f;
            box-shadow: 0 8px 0 #6b4c32, 0 10px 20px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: all 0.08s linear;
            letter-spacing: 3px;
            transform: rotate(-1deg);
            position: relative;
        }

        .btn-open:active {
            transform: translateY(6px) rotate(-1deg);
            box-shadow: 0 2px 0 #6b4c32, 0 8px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-open:disabled {
            opacity: 0.6;
            transform: translateY(4px);
            box-shadow: 0 4px 0 #6b4c32;
            pointer-events: none;
        }

        /* ----- 音乐控制按钮 ----- */
        .btn-music {
            flex: 0 0 auto;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 5px solid #5d3a1a;
            background: #f5e6d3;
            background: radial-gradient(circle at 30% 30%, #fff8f0, #dcc4b0);
            font-size: 2.4rem;
            cursor: pointer;
            box-shadow: 0 6px 0 #6b4c32, 0 8px 16px rgba(0, 0, 0, 0.2);
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #3d2b1a;
            line-height: 1;
        }

        .btn-music:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #6b4c32, 0 6px 12px rgba(0, 0, 0, 0.2);
        }

        .btn-music.muted {
            opacity: 0.5;
            filter: grayscale(0.6);
        }

        /* ===== 品牌样式（原有） ===== */
        .brand-question {
            font-size: 4rem;
            color: #5d3a1a;
        }

        .brand-domino {
            background: #0072b0;
            color: white;
            text-shadow: 2px 2px 0 #003f66;
            font-size: 2rem;
            font-weight: 900;
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.1;
        }
        .brand-domino .sub {
            font-size: 0.6rem;
            letter-spacing: 2px;
            opacity: 0.9;
        }

        .brand-mcdonald {
            background: #da291c;
            color: #ffc72c;
            text-shadow: 2px 2px 0 #8a1a0e;
            font-size: 2.8rem;
            font-weight: 900;
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1;
        }
        .brand-mcdonald .sub {
            font-size: 0.5rem;
            letter-spacing: 3px;
            color: #ffc72c;
            opacity: 0.9;
            margin-top: 2px;
        }

        .brand-kfc {
            background: #e4002b;
            color: white;
            text-shadow: 2px 2px 0 #8f001a;
            font-size: 2.6rem;
            font-weight: 900;
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1;
        }
        .brand-kfc .sub {
            font-size: 0.6rem;
            letter-spacing: 4px;
            opacity: 0.9;
        }

        .brand-butcher {
            background: #2d1b0e;
            color: #e3b48c;
            text-shadow: 2px 2px 0 #1a0f08;
            font-size: 1.8rem;
            font-weight: 900;
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.1;
        }
        .brand-butcher .sub {
            font-size: 0.55rem;
            letter-spacing: 2px;
            color: #c79a74;
            margin-top: 2px;
        }

        .brand-text {
            padding: 5px;
            border-radius: 30px;
        }

        /* ===== 动画 ===== */
        @keyframes shake {
            0% { transform: rotate(0deg) scale(1); }
            20% { transform: rotate(20deg) scale(1.1); }
            40% { transform: rotate(-20deg) scale(0.9); }
            60% { transform: rotate(15deg) scale(1.05); }
            80% { transform: rotate(-10deg) scale(0.95); }
            100% { transform: rotate(0deg) scale(1); }
        }
        .shake {
            animation: shake 0.6s ease-in-out;
        }

        @keyframes pop {
            0% { transform: scale(0) rotate(0deg); opacity: 0; }
            60% { transform: scale(1.3) rotate(10deg); opacity: 1; }
            80% { transform: scale(0.9) rotate(-5deg); }
            100% { transform: scale(1) rotate(0deg); }
        }
        .pop {
            animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
        }
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            animation: confettiFall 2s linear forwards;
        }
        @keyframes confettiFall {
            0% { transform: translateY(-20px) rotate(0deg) scale(1); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg) scale(0.2); opacity: 0; }
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #7a5d44;
            font-size: 0.9rem;
            font-weight: bold;
            opacity: 0.8;
            letter-spacing: 1px;
        }

        @media (max-width: 480px) {
            .game-container { padding: 20px; }
            .title { font-size: 1.8rem; }
            .window { width: 160px; height: 160px; }
            .gacha-ball { width: 100px; height: 100px; font-size: 2rem; }
            .btn-open { font-size: 1.4rem; padding: 14px; }
            .btn-music { width: 60px; height: 60px; font-size: 2rem; }
            .brand-domino { font-size: 1.5rem; }
            .brand-mcdonald { font-size: 2.2rem; }
            .brand-kfc { font-size: 2rem; }
            .brand-butcher { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1 class="title">
            <span>🍽️</span> 今晚吃啥？ <span>🤔</span>
        </h1>

        <div class="gacha-machine">
            <div class="machine-top"></div>

            <div class="window" id="window">
                <div class="gacha-ball" id="gachaBall">
                    <span class="brand-question">❓</span>
                </div>
            </div>

            <!-- 按钮行：开启 + 音乐控制 -->
            <div class="button-row">
                <button class="btn-open" id="btnOpen">🎰 开启</button>
                <button class="btn-music" id="btnMusic" title="点击播放/暂停音乐">🔇</button>
            </div>
        </div>

        <div class="footer">✨ 点击开启，扭出你的晚餐 ✨</div>
    </div>

    <!-- ===== 音频元素 (BGM) ===== -->
    <!-- 
        请将你的音乐文件命名为 "bgm.mp3" 并放在 index.html 同目录下。
        如果文件名或路径不同，请修改下方的 src 属性。
    -->
    <audio id="bgmAudio" src="bgm.mp3" loop preload="auto"></audio>

    <script>
        (function() {
            // ===== 餐品数据 =====
            const MENUS = [
                {
                    id: 'domino',
                    name: '达美乐',
                    cssClass: 'brand-domino',
                    displayHTML: `
                        <span style="font-size:2.2rem;">🍕</span>
                        <span>达美乐</span>
                        <span class="sub">Domino's</span>
                    `
                },
                {
                    id: 'mcdonald',
                    name: '麦当劳',
                    cssClass: 'brand-mcdonald',
                    displayHTML: `
                        <span style="font-size:2.8rem;">🍔</span>
                        <span>M</span>
                        <span class="sub">McDonald's</span>
                    `
                },
                {
                    id: 'kfc',
                    name: '肯德基',
                    cssClass: 'brand-kfc',
                    displayHTML: `
                        <span style="font-size:2.6rem;">🍗</span>
                        <span>KFC</span>
                        <span class="sub">肯德基</span>
                    `
                },
                {
                    id: 'butcher',
                    name: '屠夫汉堡',
                    cssClass: 'brand-butcher',
                    displayHTML: `
                        <span style="font-size:2rem;">🥩</span>
                        <span>屠夫汉堡</span>
                        <span class="sub">Butcher</span>
                    `
                }
            ];

            // ===== DOM 元素 =====
            const ball = document.getElementById('gachaBall');
            const btn = document.getElementById('btnOpen');
            const windowEl = document.getElementById('window');
            const audio = document.getElementById('bgmAudio');
            const btnMusic = document.getElementById('btnMusic');

            let isAnimating = false;
            let isMusicPlaying = false;

            // ===== 辅助函数 =====
            function getRandomPastel() {
                const hue = Math.floor(Math.random() * 360);
                return `hsl(${hue}, 70%, 75%)`;
            }

            function showResult(menu) {
                ball.className = 'gacha-ball';
                ball.classList.add(menu.cssClass);
                ball.innerHTML = menu.displayHTML;
            }

            function showQuestion() {
                ball.className = 'gacha-ball';
                ball.innerHTML = `<span class="brand-question">❓</span>`;
            }

            function fireConfetti() {
                const container = document.createElement('div');
                container.className = 'confetti-container';
                document.body.appendChild(container);
                const colors = ['#f44336', '#e91e63', '#9c27b0', '#3f51b5', '#4caf50', '#ffeb3b', '#ff9800', '#00bcd4'];
                for (let i = 0; i < 60; i++) {
                    const piece = document.createElement('div');
                    piece.className = 'confetti';
                    piece.style.left = Math.random() * 100 + '%';
                    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                    piece.style.width = (Math.random() * 8 + 4) + 'px';
                    piece.style.height = (Math.random() * 8 + 4) + 'px';
                    piece.style.animationDuration = (Math.random() * 1.5 + 1.2) + 's';
                    piece.style.animationDelay = Math.random() * 0.8 + 's';
                    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                    container.appendChild(piece);
                }
                setTimeout(() => container.remove(), 3500);
            }

            // ===== 核心：抽取 =====
            function drawGacha() {
                if (isAnimating) return;
                isAnimating = true;
                btn.disabled = true;

                // 尝试启动音乐（如果尚未播放且未被用户暂停）
                // 注意：自动播放策略要求用户手势触发，这里点击"开启"按钮即用户手势。
                if (!isMusicPlaying) {
                    // 如果音频未加载，尝试加载并播放
                    audio.load(); // 重新加载确保能播放
                    audio.play().then(() => {
                        isMusicPlaying = true;
                        updateMusicIcon();
                    }).catch(err => {
                        // 如果自动播放被阻止，用户需手动点击音乐按钮
                        console.log('自动播放被阻止，请手动点击音乐按钮开启。');
                    });
                }

                const index = Math.floor(Math.random() * MENUS.length);
                const menu = MENUS[index];

                ball.classList.remove('pop', 'shake');
                void ball.offsetWidth;
                ball.classList.add('shake');

                setTimeout(() => {
                    ball.classList.remove('shake');
                    showResult(menu);
                    ball.classList.add('pop');
                    fireConfetti();

                    setTimeout(() => {
                        isAnimating = false;
                        btn.disabled = false;
                        ball.classList.remove('pop');
                    }, 600);
                }, 700);
            }

            // ===== 音乐控制 =====
            function toggleMusic() {
                if (isMusicPlaying) {
                    audio.pause();
                    isMusicPlaying = false;
                } else {
                    audio.play().then(() => {
                        isMusicPlaying = true;
                    }).catch(err => {
                        alert('无法播放音乐，请检查音频文件是否存在且格式正确。');
                        console.error(err);
                    });
                }
                updateMusicIcon();
            }

            function updateMusicIcon() {
                if (isMusicPlaying) {
                    btnMusic.textContent = '🔊';
                    btnMusic.classList.remove('muted');
                } else {
                    btnMusic.textContent = '🔇';
                    btnMusic.classList.add('muted');
                }
            }

            // ===== 初始化 =====
            showQuestion();

            // 默认图标为静音（因为还未播放）
            btnMusic.textContent = '🔇';
            btnMusic.classList.add('muted');

            // 事件绑定
            btn.addEventListener('click', drawGacha);
            btnMusic.addEventListener('click', toggleMusic);

            // 当音频加载失败时给出提示（但不影响游戏）
            audio.addEventListener('error', function(e) {
                console.warn('音频文件加载失败，请确认文件存在。');
            });

            // 如果用户点击开启按钮时音乐还未启动，触发播放（已在 drawGacha 中处理）

            console.log('🍔 扭蛋机已启动！点击"开启"抽取晚餐，点击音乐按钮开关BGM。');
        })();
    </script>
</body>
</html>
